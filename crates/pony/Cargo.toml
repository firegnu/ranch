[package]
name = "pony"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Chat bridge runtime, independent of corral"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
tempfile = "3"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
tungstenite = "=0.30.0"
