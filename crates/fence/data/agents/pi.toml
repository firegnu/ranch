description = "pi"
read = ["${home}/.bun/bin", "${home}/node_modules", "${home}/.pi/agent"]
write = ["${home}/.pi/agent/sessions", "${home}/.pi/agent/auth.json.lock", "${home}/.pi/agent/settings.json.lock"]
deny_write = ["${home}/.pi/agent/settings.json", "${home}/.pi/agent/auth.json", "${home}/.pi/agent/models.json"]
[mcp]
args = ["--extension", "${mcp_dir}/pi.ts"]
[mcp.files]
"pi.ts" = '''
export default function (pi) {
  pi.registerMcpServer("fence_${mcp_name}", {
    url: ${mcp_url:json},
    headers: { Authorization: "", ...${mcp_headers_json} },
    exposure: "direct",
  });
}
'''
[macos]
allow_pty = true
[linux]
write = ["${home}/.pi/agent"]
