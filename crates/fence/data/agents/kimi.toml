description = "Kimi Code；自带服务端搜索、读网页，不注入 MCP"
services = ["kimi"]
write = ["${home}/.kimi-code"]
deny_write = [
  "${home}/.kimi-code/config.toml", "${home}/.kimi-code/tui.toml",
  "${home}/.kimi-code/region",
  "${home}/.kimi-code/server.token", "${home}/.kimi-code/device_id",
  "${home}/.kimi-code/mcp.json", "${home}/.kimi-code/plugins",
  "${home}/.kimi-code/AGENTS.md", "${home}/.kimi-code/skills",
  "${home}/.kimi-code/agents", "${home}/.kimi-code/workspace-trust",
  "${home}/.kimi-code/bin",
]
env = { KIMI_CODE_NO_AUTO_UPDATE = "1", KIMI_DISABLE_TELEMETRY = "1", KIMI_CODE_WATCH = "0", KIMI_CODE_CACHE_DIR = "${tmp}/kimi-cache" }
[macos]
allow_pty = true
