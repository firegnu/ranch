[agents.claude]
efforts = ["high", "xhigh"]
models = ["opus[1m]"]
argv = ["claude", "--dangerously-skip-permissions", "--model", "${model}", "--effort", "${effort}"]
labels = ["effort=${effort}", "model=${model}"]

[agents.codex]
efforts = ["high", "xhigh"]
models = ["gpt-6-astra"]
argv = ["codex", "--yolo", "--disable", "memories", "-m", "${model}", "-c", 'model_reasoning_effort="${effort}"']
labels = ["effort=${effort}", "model=${model}"]

[agents.pi]
efforts = []
models = []
argv = ["pi"]
labels = []

[agents.omp]
efforts = []
models = []
argv = ["omp", "--approval-mode", "yolo"]
labels = []

[agents.amp]
efforts = []
models = []
argv = ["amp"]
labels = []

[agents.agy]
efforts = []
models = []
argv = ["agy", "--dangerously-skip-permissions"]
labels = []

[cells.low-design]
description = "低档：界面和设计"
agents = ["pi", "omp"]
rework = "middle-design"

[cells.low-other]
description = "低档：其余"
agents = ["pi", "omp"]
rework = "middle-other"

[cells.middle-design]
description = "中档：界面和设计"
agents = ["claude"]
model = "opus[1m]"
effort = "high"
rework = "high-design"

[cells.middle-other]
description = "中档：其余"
agents = ["codex"]
model = "gpt-6-astra"
effort = "high"
rework = "high-other"

[cells.high-design]
description = "高档：界面和设计"
agents = ["claude"]
model = "opus[1m]"
effort = "xhigh"

[cells.high-other]
description = "高档：其余"
agents = ["codex"]
model = "gpt-6-astra"
effort = "xhigh"

[cells.critical-design]
description = "碰要害：界面和设计"
agents = ["claude"]
model = "opus[1m]"
effort = "xhigh"
cross_review = "review-codex"

[cells.critical-other]
description = "碰要害：其余"
agents = ["codex"]
model = "gpt-6-astra"
effort = "xhigh"
cross_review = "review-claude"

[cells.review-codex]
description = "交叉审查：Codex 审 Claude Code 写的碰要害改动"
agents = ["codex"]
model = "gpt-6-astra"
effort = "xhigh"

[cells.review-claude]
description = "交叉审查：Claude Code 审 Codex 写的碰要害改动"
agents = ["claude"]
model = "opus[1m]"
effort = "xhigh"

[cells.amp]
description = "只在用户或任务文件点名 amp 时使用"
agents = ["amp"]

[cells.agy]
description = "只在用户或任务文件点名 agy 时使用"
agents = ["agy"]
