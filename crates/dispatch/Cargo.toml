[package]
name = "ranch-dispatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Task routing and the corral-dispatch skill behind `ranch dispatch`"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tempfile = "3"
