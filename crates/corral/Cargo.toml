[package]
name = "corral-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Agent runtime shipped with ranch, used by the Saddle and paddock front ends"

[[bin]]
name = "corral"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
